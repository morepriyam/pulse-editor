buildscript {
  ext.PulseEditor = [
    kotlinVersion: "2.0.21",
    minSdkVersion: 29,
    compileSdkVersion: 36,
    media3Version: "1.11.1"
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return PulseEditor[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

apply plugin: "com.android.library"

if (project.extensions.findByName("kotlin") == null) {
  apply plugin: "kotlin-android"
}

apply from: '../nitrogen/generated/android/pulseeditor+autolinking.gradle'

apply plugin: "com.facebook.react"

// Nitro generates this module's bindings; React Native codegen has nothing to do here. Point it
// at src/ so it never scans the module's own node_modules (which would generate React Native's
// built-in view managers into this library and collide with the app's copies at dex merge).
react {
  jsRootDir = file("../src")
}

android {
  namespace "com.margelo.nitro.pulseeditor"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")

    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        abiFilters (*reactNativeArchitectures())

        buildTypes {
          debug {
            cppFlags "-O1 -g"
          }
          release {
            cppFlags "-O2"
          }
        }
      }
    }
  }

  if (rootProject.ext.has("ndkVersion")) {
    ndkVersion rootProject.ext.ndkVersion
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  packaging {
    resources {
      excludes += [
        "META-INF",
        "META-INF/**"
      ]
    }

    jniLibs {
      excludes += [
        "**/libc++_shared.so",
        "**/libfbjni.so",
        "**/libjsi.so",
        "**/libfolly_json.so",
        "**/libfolly_runtime.so",
        "**/libglog.so",
        "**/libhermes.so",
        "**/libhermes-executor-debug.so",
        "**/libhermes_executor.so",
        "**/libreactnative.so",
        "**/libreactnativejni.so",
        "**/libturbomodulejsijni.so",
        "**/libreact_nativemodule_core.so",
        "**/libjscexecutor.so"
      ]
    }
  }

  buildFeatures {
    prefab true
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation project(":react-native-nitro-modules")

  // Platform media stack only: Media3 Transformer (hardware MediaCodec encode/decode, edits,
  // composition export), Effect (crop / rotate / speed) and Inspector (metadata for probe).
  // No FFmpeg.
  def media3Version = getExtOrDefault("media3Version")
  implementation "androidx.media3:media3-transformer:$media3Version"
  implementation "androidx.media3:media3-effect:$media3Version"
  implementation "androidx.media3:media3-muxer:$media3Version"
  implementation "androidx.media3:media3-common:$media3Version"
  implementation "androidx.media3:media3-inspector:$media3Version"
  implementation "androidx.media3:media3-inspector-frame:$media3Version"
  // ListenableFuture.await() for Media3's async retrieval inside Nitro's Promise.async.
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-guava:1.9.0"
}
